name: Build, Sign and Release AurrosGroup Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-sign-release:
    name: Build, Sign and Release Installer
    runs-on: windows-latest
    environment: aurros-installer-signing

    steps:

      # ==========================================================
      # 1. Validate release tag
      # ==========================================================

      - name: Validate Release Tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"

          if ([string]::IsNullOrWhiteSpace($tag)) {
              throw "Release tag cannot be empty."
          }

          if (-not $tag.StartsWith("v")) {
              throw "Release tag must start with 'v'. Example: v1.0.0.0"
          }

          Write-Host "Release tag: $tag"

      # ==========================================================
      # 2. Checkout source
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 3. Setup .NET
      # ==========================================================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ==========================================================
      # 4. Restore AurrosGroup project
      # ==========================================================

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\AurrosGroup\AurrosGroup.csproj

      # ==========================================================
      # 5. Build AurrosGroup
      # ==========================================================

      - name: Build
        shell: pwsh
        run: |
          dotnet build .\AurrosGroup\AurrosGroup.csproj `
            -c Release `
            --no-restore

      # ==========================================================
      # 6. Publish single-file Installer.exe
      # ==========================================================

      - name: Publish Installer
        shell: pwsh
        run: |
          $publishDir = "${{ github.workspace }}\publish"

          dotnet publish `
              .\AurrosGroup\AurrosGroup.csproj `
              -c Release `
              -r win-x64 `
              --self-contained true `
              --no-restore `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true `
              -p:PublishTrimmed=false `
              -p:AssemblyName=Installer `
              -o "$publishDir"

          if ($LASTEXITCODE -ne 0) {
              throw "AurrosGroup publish failed."
          }

          $publishedExe = Join-Path $publishDir "Installer.exe"

          if (-not (Test-Path $publishedExe)) {
              throw "Installer.exe was not produced by dotnet publish."
          }

          $file = Get-Item $publishedExe

          Write-Host "Published installer:"
          Write-Host $file.FullName
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -lt 100000) {
              throw "Installer.exe appears unexpectedly small."
          }

      # ==========================================================
      # 7. Decode AurrosGroup signing certificate
      # ==========================================================

      - name: Decode AurrosGroup Signing Certificate
        shell: pwsh
        env:
          BASE64_PFX: ${{ secrets.AURROS_INSTALLER_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BASE64_PFX)) {
              throw "AURROS_INSTALLER_PFX_BASE64 secret is missing."
          }

          $certificatePath =
              "${{ github.workspace }}\AurrosInstaller_signing.pfx"

          try {
              $bytes = [Convert]::FromBase64String(
                  $env:BASE64_PFX
              )

              [IO.File]::WriteAllBytes(
                  $certificatePath,
                  $bytes
              )
          }
          catch {
              throw "AURROS_INSTALLER_PFX_BASE64 is not valid Base64."
          }

          if (-not (Test-Path $certificatePath)) {
              throw "AurrosGroup signing certificate could not be created."
          }

          $size = (Get-Item $certificatePath).Length

          Write-Host "Temporary AurrosGroup PFX created."
          Write-Host "PFX size: $size bytes"

      # ==========================================================
      # 8. Locate SignTool
      # ==========================================================

      - name: Locate SignTool
        id: signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem `
              -Path "C:\Program Files (x86)\Windows Kits" `
              -Filter "signtool.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.FullName -match "\\x64\\signtool\.exe$"
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

          if (-not $signtool) {
              throw "SignTool.exe could not be found."
          }

          Write-Host "Using SignTool:"
          Write-Host $signtool.FullName

          "PATH=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      # ==========================================================
      # 9. Sign Installer.exe
      # ==========================================================

      - name: Sign Installer.exe
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.AURROS_INSTALLER_CERT_PASSWORD }}
        run: |
          $signtool =
              "${{ steps.signtool.outputs.PATH }}"

          $certificate =
              "${{ github.workspace }}\AurrosInstaller_signing.pfx"

          $exe =
              "${{ github.workspace }}\publish\Installer.exe"

          if (-not (Test-Path $certificate)) {
              throw "AurrosGroup signing certificate does not exist."
          }

          if (-not (Test-Path $exe)) {
              throw "Installer.exe does not exist."
          }

          if ([string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
              throw "AURROS_INSTALLER_CERT_PASSWORD secret is missing."
          }

          & $signtool sign `
              /f "$certificate" `
              /p "$env:CERT_PASSWORD" `
              /fd SHA256 `
              /tr "http://timestamp.digicert.com" `
              /td SHA256 `
              /d "AurrosGroup Installer" `
              "$exe"

          if ($LASTEXITCODE -ne 0) {
              throw "SignTool failed with exit code $LASTEXITCODE."
          }

          Write-Host "Installer.exe signed successfully."

      # ==========================================================
      # 10. Verify Authenticode signature
      # ==========================================================

      - name: Verify Digital Signature
        shell: pwsh
        env:
          EXPECTED_THUMBPRINT: ${{ secrets.AURROS_INSTALLER_CERT_THUMBPRINT }}
        run: |
          $exe =
              "${{ github.workspace }}\publish\Installer.exe"

          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_THUMBPRINT)) {
              throw "AURROS_INSTALLER_CERT_THUMBPRINT secret is missing."
          }

          $signature = Get-AuthenticodeSignature $exe

          Write-Host "Signature Status:"
          Write-Host $signature.Status

          if (-not $signature.SignerCertificate) {
              throw "No signing certificate was found."
          }

          $actual =
              $signature.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant()

          $expected =
              $env:EXPECTED_THUMBPRINT.Replace(" ", "").ToUpperInvariant()

          Write-Host "Signer:"
          Write-Host $signature.SignerCertificate.Subject

          Write-Host "Thumbprint:"
          Write-Host $actual

          Write-Host "Certificate expires:"
          Write-Host $signature.SignerCertificate.NotAfter

          if ($actual -ne $expected) {
              throw "Signing certificate thumbprint does not match the expected AurrosGroup certificate."
          }

          if ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed: $($signature.Status)"
          }

          Write-Host "Authenticode signature is valid."
          Write-Host "AurrosGroup certificate thumbprint verified."

      # ==========================================================
      # 11. Create GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"

          gh release create `
              "$tag" `
              "${{ github.workspace }}\publish\Installer.exe" `
              --repo "${{ github.repository }}" `
              --title "AurrosGroup Installer $tag" `
              --generate-notes

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create AurrosGroup release $tag."
          }

          Write-Host "AurrosGroup GitHub release created successfully."

      # ==========================================================
      # 12. Destroy temporary signing certificate
      # ==========================================================

      - name: Destroy Temporary Certificate
        if: always()
        shell: pwsh
        run: |
          $certificate =
              "${{ github.workspace }}\AurrosInstaller_signing.pfx"

          if (Test-Path $certificate) {
              Remove-Item `
                  "$certificate" `
                  -Force `
                  -ErrorAction SilentlyContinue

              Write-Host "Temporary AurrosGroup PFX deleted."
          }

      # ==========================================================
      # 13. Clean runner files
      # ==========================================================

      - name: Clean Runner Files
        if: always()
        shell: pwsh
        run: |
          $files = @(
              "${{ github.workspace }}\publish\Installer.exe",
              "${{ github.workspace }}\AurrosInstaller_signing.pfx"
          )

          foreach ($file in $files) {
              if (Test-Path $file) {
                  Remove-Item `
                      "$file" `
                      -Force `
                      -ErrorAction SilentlyContinue
              }
          }

          Write-Host "Temporary AurrosGroup runner files cleaned."
